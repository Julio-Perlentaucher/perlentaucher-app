<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#456b58"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/app-icon.jpg"><title>PERLENTAUCHER - Gestión de Obra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--g:#5d856f;--g2:#456b58;--ink:#17201b;--mut:#6e7771;--bg:#f3f5f3;--line:#dfe5e1;--red:#a94a45;--amber:#b37a24}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#17231d;color:white;padding:20px 15px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:0 7px 22px}.brand img{width:48px;height:48px;border-radius:10px;object-fit:cover}.brand b{letter-spacing:.7px}.brand small{color:#b9c7bf}.nav button{width:100%;border:0;background:transparent;color:#d0d9d4;padding:11px 12px;border-radius:9px;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#2b3c33;color:#fff}.main{padding:24px 30px;max-width:1500px;width:100%}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:24px;margin:0}.title p{margin:3px 0;color:var(--mut)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650}.primary{background:var(--g2);color:white}.ghost{background:#eaf0ec;color:#26352d}.danger{background:#f6e8e7;color:var(--red)}.card,.stat{background:white;border:1px solid var(--line);border-radius:14px}.card{padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px}.stat b{font-size:24px;display:block}.stat span,.note{color:var(--mut)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.cardhead h2{font-size:16px;margin:0}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--mut);font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #d8ded9;border-radius:8px;padding:9px;background:#fff;min-width:0}.span2{grid-column:span 2}.span3{grid-column:span 3}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #e8ece9;text-align:left;vertical-align:top}th{font-size:11px;color:var(--mut);text-transform:uppercase}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;background:#edf1ee}.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed #cfd7d2;border-radius:12px}.drop{border:2px dashed #b9c9c0;border-radius:12px;padding:22px;text-align:center;background:#f8faf9;cursor:pointer}.drop.drag{background:#eaf2ed;border-color:var(--g2)}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.filechip{padding:6px 9px;background:#edf1ee;border-radius:8px;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(920px,97vw);max-height:94vh;overflow:auto}.hidden{display:none!important}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer}.timeline{border-left:2px solid #cfd9d3;margin:15px 0 0 8px;padding-left:18px}.event{position:relative;margin-bottom:18px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--g);left:-24px;top:5px}.plan{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.annotWrap{overflow:auto;max-height:65vh;background:#222;text-align:center}.annotWrap canvas{touch-action:none;max-width:none}.mobilebar{display:none}.user{background:#fff;border:1px solid var(--line);border-radius:25px;padding:8px 12px}.checklist label{display:block;padding:7px;border-bottom:1px solid #eee}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:14px 12px 80px}.topbar{align-items:flex-start}.topbar .primary{display:none}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.card{padding:14px}.cardhead{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#17231d;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:8}.mobilebar button{border:0;background:transparent;color:#d0d9d4;font-size:11px;padding:7px 2px}.mobilebar b{display:block;font-size:18px}.title h1{font-size:20px}.user{font-size:12px}}
@media print{.side,.mobilebar,.topbar,.no-print{display:none!important}.app{display:block}.main{padding:0}.card{border:0}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="assets/app-icon.jpg"><div><b>PERLENTAUCHER</b><br><small>Gestión de Obra</small></div></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="topbar"><div class="title"><h1 id="viewTitle">Resumen</h1><p id="viewSub"></p></div><div class="toolbar"><button class="btn primary" onclick="openIncident()">+ Nueva incidencia</button><div class="user" id="userChip"></div></div></div><div id="content"></div></main></div><nav class="mobilebar" id="mobilebar"></nav><div id="modal" class="modal hidden"></div>
<script>
const KEY='pt_suite_v2';const seed={user:'Administrador',works:[],categories:[],incidents:[],plans:[],minutes:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const $=s=>document.querySelector(s);const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const navs=[['dashboard','▦','Resumen'],['obras','⌂','Obras'],['incidencias','⚠','Incidencias'],['planos','▱','Planos'],['actas','☷','Actas'],['listados','⇩','Listados'],['config','⚙','Config.']];$('#nav').innerHTML=navs.map((n,i)=>`<button data-view="${n[0]}" class="${i?'':'active'}">${n[1]} &nbsp;<span>${n[2]}</span></button>`).join('');$('#mobilebar').innerHTML=navs.slice(0,5).map(n=>`<button data-view="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));
const titles={dashboard:['Resumen','Control general de obras e incidencias'],obras:['Obras','Crea y administra las obras'],incidencias:['Incidencias','Seguimiento, documentación y trazabilidad'],planos:['Planos','Biblioteca de planos asociada a cada obra'],actas:['Actas','Agrupa incidencias en actas de obra'],listados:['Listados y exportación','Filtra y exporta a Excel'],config:['Configuración','Usuario y categorías']};function render(v='dashboard'){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#viewTitle').textContent=titles[v][0];$('#viewSub').textContent=titles[v][1];$('#userChip').textContent='Usuario: '+db.user;({dashboard,obras,incidencias,planos,actas,listados,config}[v])()}
const worksOpts=()=>db.works.map(w=>`<option>${esc(w)}</option>`).join(''),catsOpts=()=>db.categories.map(c=>`<option>${esc(c)}</option>`).join('');function nextNo(w){return String(Math.max(0,...db.incidents.filter(i=>i.work===w).map(i=>+i.no||0))+1).padStart(3,'0')}function dashboard(){let s=x=>db.incidents.filter(i=>i.status===x).length;$('#content').innerHTML=`<div class=grid><div class=stat><b>${db.works.length}</b><span>Obras</span></div><div class=stat><b>${db.incidents.length}</b><span>Incidencias</span></div><div class=stat><b>${s('Pendiente')}</b><span>Pendientes</span></div><div class=stat><b>${s('En proceso')}</b><span>En proceso</span></div></div><div class=card><div class=cardhead><h2>Incidencias recientes</h2><button class="btn primary no-print" onclick="openIncident()">+ Nueva incidencia</button></div>${incidentTable(db.incidents.slice(-8).reverse())}</div>`}
function obras(){let r=db.works.map(w=>`<tr><td><b>${esc(w)}</b></td><td>${db.incidents.filter(i=>i.work===w).length}</td><td>${db.plans.filter(p=>p.work===w).length}</td><td><button class="btn ghost" onclick="openIncident('${esc(w)}')">Nueva incidencia</button> <button class="btn danger" onclick="delWork('${esc(w)}')">Quitar</button></td></tr>`).join('');$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Obras</h2><div class=toolbar><input id=newWork placeholder="Nombre de la obra"><button class="btn primary" onclick=addWork()>+ Añadir</button></div></div>${r?`<table><thead><tr><th>Obra</th><th>Incidencias</th><th>Planos</th><th></th></tr></thead><tbody>${r}</tbody></table>`:'<div class=empty>No hay obras. La lista comienza vacía.</div>'}</div>`}function addWork(){let v=$('#newWork').value.trim();if(v&&!db.works.includes(v)){db.works.push(v);save();obras()}}function delWork(w){if(db.incidents.some(i=>i.work===w)||db.plans.some(p=>p.work===w))return alert('No se puede quitar: contiene incidencias o planos.');if(confirm('¿Quitar obra?')){db.works=db.works.filter(x=>x!==w);save();obras()}}
function incidentTable(a){if(!a.length)return '<div class=empty>No hay incidencias.</div>';return `<table><thead><tr><th>Nº</th><th>Obra / título</th><th>Categoría</th><th>Zona</th><th>Estado</th><th>Prioridad</th><th>Actualizada</th></tr></thead><tbody>${a.map(i=>`<tr onclick="showIncident('${i.id}')" style="cursor:pointer"><td><b>${i.no}</b></td><td><b>${esc(i.work)}</b><br>${esc(i.title)}</td><td>${esc(i.category||'—')}</td><td>${esc(i.zone||'—')}</td><td><span class=pill>${esc(i.status)}</span></td><td>${esc(i.priority)}</td><td>${esc(i.updated||i.date)}</td></tr>`).join('')}</tbody></table>`}
function incidencias(){let f=`<div class=toolbar><select id=fw onchange=filterInc()><option value="">Todas las obras</option>${worksOpts()}</select><select id=fc onchange=filterInc()><option value="">Todas las categorías</option>${catsOpts()}</select><select id=fs onchange=filterInc()><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select><input id=fq oninput=filterInc() placeholder="Buscar..."></div>`;$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Incidencias</h2>${f}</div><div id=incTable>${incidentTable(db.incidents)}</div></div>`}function filterInc(){let w=$('#fw').value,c=$('#fc').value,s=$('#fs').value,q=$('#fq').value.toLowerCase();$('#incTable').innerHTML=incidentTable(db.incidents.filter(i=>(!w||i.work===w)&&(!c||i.category===c)&&(!s||i.status===s)&&(!q||JSON.stringify(i).toLowerCase().includes(q))))}
let pendingFiles=[];function openIncident(work=''){if(!db.works.length)return alert('Primero añade una obra.');pendingFiles=[];$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Nueva incidencia</h2><button class=x onclick=closeModal()>×</button></div><div class=formgrid><div class=field><label>Obra</label><select id=iw>${worksOpts()}</select></div><div class="field span2"><label>Título</label><input id=it placeholder="Título del informe"></div><div class=field><label>Fecha</label><input id=idate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Categoría</label><select id=ic><option value="">Sin categoría</option>${catsOpts()}</select></div><div class=field><label>Zona</label><input id=iz></div><div class=field><label>Ubicación</label><input id=il></div><div class=field><label>Responsable</label><input id=ir></div><div class=field><label>Estado</label><select id=is><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class=field><label>Prioridad</label><select id=ip><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div><div class="field span3"><label>Descripción</label><textarea id=ides rows=7></textarea></div><div class="field span3"><label>Fotografías y documentos</label><div class=drop id=incDrop>Arrastra y suelta aquí fotografías/PDF o pulsa para seguir la ruta del archivo<input id=ifiles type=file multiple accept="image/*,.pdf" hidden></div><div id=incFiles class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn ghost" onclick=closeModal()>Cancelar</button><button class="btn primary" onclick=saveIncident()>Crear incidencia</button></div></div>`;$('#iw').value=work||db.works[0];wireDrop('incDrop','ifiles',fs=>{pendingFiles=[...pendingFiles,...fs].map(f=>({name:f.name,type:f.type,size:f.size}));$('#incFiles').innerHTML=pendingFiles.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}
function wireDrop(dropId,inputId,cb){let d=$('#'+dropId),i=$('#'+inputId);d.onclick=()=>i.click();i.onchange=()=>cb([...i.files]);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>cb([...e.dataTransfer.files]))}
function saveIncident(){let w=$('#iw').value,t=$('#it').value.trim();if(!t)return alert('Escribe un título.');let d=$('#idate').value,i={id:uid(),no:nextNo(w),work:w,title:t,date:d,updated:d,category:$('#ic').value,zone:$('#iz').value,location:$('#il').value,responsible:$('#ir').value,status:$('#is').value,priority:$('#ip').value,description:$('#ides').value,author:db.user,files:pendingFiles,planCapture:null,history:[{date:d,author:db.user,text:'Incidencia creada',status:$('#is').value,files:[]}]};db.incidents.push(i);save();closeModal();render('incidencias')}
function showIncident(id){let i=db.incidents.find(x=>x.id===id);$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><div><h2>${esc(i.work)} - ${i.no}</h2><div class=note>${esc(i.title)}</div></div><button class=x onclick=closeModal()>×</button></div><div class=toolbar style="margin:12px 0"><button class="btn primary" onclick="followUp('${id}')">+ Añadir seguimiento</button><button class="btn ghost" onclick="editIncident('${id}')">Editar datos</button><button class="btn ghost" onclick="reportPDF('${id}')">PDF</button><button class="btn ghost" onclick="reportWord('${id}')">Word</button></div><div class=grid style="grid-template-columns:repeat(3,1fr)"><div class=stat><span>Estado</span><b style="font-size:16px">${esc(i.status)}</b></div><div class=stat><span>Categoría</span><b style="font-size:16px">${esc(i.category||'—')}</b></div><div class=stat><span>Responsable</span><b style="font-size:16px">${esc(i.responsible||'—')}</b></div></div><div class=card><b>Descripción</b><p>${esc(i.description||'—')}</p><div class=note>Zona: ${esc(i.zone||'—')} · Ubicación: ${esc(i.location||'—')} · Realizado por: ${esc(i.author)}</div>${i.files?.length?`<div class=files>${i.files.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div><div class=card><div class=cardhead><h2>Historial</h2></div><div class=timeline>${i.history.slice().reverse().map(h=>`<div class=event><b>${esc(h.text)}</b><br><small>${esc(h.date)} · ${esc(h.author)} · ${esc(h.status||'')}</small>${h.files?.length?`<div class=files>${h.files.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div>`).join('')}</div></div></div>`}
function followUp(id){let i=db.incidents.find(x=>x.id===id);$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Seguimiento - ${i.no}</h2><button class=x onclick="showIncident('${id}')">×</button></div><div class=formgrid><div class=field><label>Fecha</label><input id=fdate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Estado</label><select id=fstatus><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class="field span3"><label>Comentario</label><textarea id=ftext rows=6></textarea></div><div class="field span3"><label>Nuevas fotos/documentos</label><div class=drop id=followDrop>Arrastra y suelta o pulsa para elegir archivos<input id=followFiles type=file multiple accept="image/*,.pdf" hidden></div><div id=followNames class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn primary" onclick="saveFollow('${id}')">Guardar seguimiento</button></div></div>`;$('#fstatus').value=i.status;window.followPending=[];wireDrop('followDrop','followFiles',fs=>{followPending=[...followPending,...fs].map(f=>({name:f.name,type:f.type,size:f.size}));$('#followNames').innerHTML=followPending.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}function saveFollow(id){let i=db.incidents.find(x=>x.id===id),d=$('#fdate').value,t=$('#ftext').value.trim();if(!t)return alert('Añade un comentario.');i.status=$('#fstatus').value;i.updated=d;i.history.push({date:d,author:db.user,text:t,status:i.status,files:followPending});save();showIncident(id)}
function editIncident(id){let i=db.incidents.find(x=>x.id===id),t=prompt('Título:',i.title);if(t!==null)i.title=t.trim()||i.title;let r=prompt('Responsable:',i.responsible||'');if(r!==null)i.responsible=r;save();showIncident(id)}
function planos(){let w=db.works[0]||'';$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Biblioteca de planos</h2><select id=pw onchange=renderPlans()>${worksOpts()}</select></div><div class=drop id=planDrop>Arrastra y suelta planos PDF aquí o pulsa para seguir la ruta y seleccionarlos<input id=planFiles type=file multiple accept="application/pdf,.pdf" hidden></div><div id=plans style="margin-top:12px"></div></div>`;if(w){wireDrop('planDrop','planFiles',addPlanFiles);renderPlans()}else $('#plans').innerHTML='<div class=empty>Crea una obra antes de añadir planos.</div>'}function addPlanFiles(fs){let w=$('#pw').value;fs.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')).forEach(f=>db.plans.push({id:uid(),work:w,name:f.name,rev:'01',date:new Date().toISOString().slice(0,10),size:f.size}));save();renderPlans()}function renderPlans(){let w=$('#pw').value,a=db.plans.filter(p=>p.work===w);$('#plans').innerHTML=a.length?a.map(p=>`<div class=plan><div><b>${esc(p.name)}</b><br><span class=note>Rev. ${esc(p.rev)} · ${p.date}</span></div><div><button class="btn ghost" onclick="updatePlan('${p.id}')">Actualizar</button> <button class="btn ghost" onclick="markPlan('${p.id}')">Localizar</button> <button class="btn danger" onclick="delPlan('${p.id}')">Quitar</button></div></div>`).join(''):'<div class=empty>Esta obra todavía no tiene planos.</div>'}function updatePlan(id){let p=db.plans.find(x=>x.id===id),r=prompt('Nueva revisión:',p.rev);if(r){p.rev=r;p.date=new Date().toISOString().slice(0,10);save();renderPlans()}}function delPlan(id){if(confirm('¿Quitar plano?')){db.plans=db.plans.filter(x=>x.id!==id);save();renderPlans()}}function markPlan(id){alert('Flujo de localización: seleccionar plano → abrir página → zoom/desplazar → fijar vista → marcar con dedo/ratón → guardar captura en la incidencia. La interfaz queda reservada para el visor PDF del despliegue conectado.');}
function actas(){let r=db.minutes.map(m=>`<tr><td>${m.no}</td><td><b>${esc(m.work)}</b><br>${esc(m.title)}</td><td>${m.date}</td><td>${m.incidents.length}</td><td>${esc(m.author)}</td></tr>`).join('');$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Actas</h2><button class="btn primary" onclick=createMinute()>+ Crear acta</button></div>${r?`<table><thead><tr><th>Nº</th><th>Acta</th><th>Fecha</th><th>Incidencias</th><th>Autor</th></tr></thead><tbody>${r}</tbody></table>`:'<div class=empty>No hay actas.</div>'}</div>`}function createMinute(){if(!db.works.length)return alert('Primero crea una obra.');let w=prompt('Obra:',db.works[0]);if(!db.works.includes(w))return;let avail=db.incidents.filter(i=>i.work===w);if(!avail.length)return alert('No hay incidencias en esta obra.');let nums=prompt('Números a incluir separados por coma:',avail.map(i=>i.no).join(','));if(!nums)return;let sel=nums.split(',').map(x=>x.trim()),ids=avail.filter(i=>sel.includes(i.no)).map(i=>i.id),title=prompt('Título del acta:','Revisión de obra')||'Revisión de obra';db.minutes.push({id:uid(),no:String(db.minutes.filter(m=>m.work===w).length+1).padStart(3,'0'),work:w,title,date:new Date().toISOString().slice(0,10),incidents:ids,author:db.user});save();actas()}
function listados(){$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Listado general</h2><div class=toolbar><button class="btn primary" onclick=exportXLSX()>Exportar Excel</button><button class="btn ghost" onclick=window.print()>Imprimir</button></div></div>${incidentTable(db.incidents)}</div>`}function exportXLSX(){let rows=db.incidents.map(i=>({'Nº':i.no,'Obra':i.work,'Título':i.title,'Categoría':i.category,'Zona':i.zone,'Ubicación':i.location,'Responsable':i.responsible,'Estado':i.status,'Prioridad':i.priority,'Fecha':i.date,'Actualizada':i.updated,'Realizado por':i.author}));if(window.XLSX){let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Incidencias');XLSX.writeFile(wb,'PERLENTAUCHER_Incidencias.xlsx')}else exportCSV(rows)}function exportCSV(rows){let h=Object.keys(rows[0]||{'Nº':''}),csv='\ufeff'+[h,...rows.map(Object.values)].map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PERLENTAUCHER_Incidencias.csv';a.click()}
function config(){$('#content').innerHTML=`<div class=card><h2>Usuario actual</h2><div class=toolbar><input id=uname value="${esc(db.user)}"><button class="btn primary" onclick="db.user=$('#uname').value.trim()||'Usuario';save();render('config')">Guardar</button></div></div><div class=card><div class=cardhead><h2>Categorías</h2><div class=toolbar><input id=newCat placeholder="Nueva categoría"><button class="btn primary" onclick=addCat()>+ Añadir</button></div></div>${db.categories.length?db.categories.map(c=>`<span class=filechip>${esc(c)} <button onclick="delCat('${esc(c)}')" style="border:0;background:transparent">×</button></span>`).join(''):'<div class=empty>Las categorías comienzan vacías.</div>'}</div><div class=card><b>Sincronización multiusuario</b><p class=note>La aplicación está preparada como PWA de escritorio y móvil. Para sincronización real entre compañeros hace falta publicar esta carpeta en HTTPS y conectar un backend/base de datos común. Las credenciales del servicio no se incluyen en el paquete por seguridad.</p></div>`}function addCat(){let v=$('#newCat').value.trim();if(v&&!db.categories.includes(v)){db.categories.push(v);save();config()}}function delCat(c){if(db.incidents.some(i=>i.category===c))return alert('Categoría en uso.');db.categories=db.categories.filter(x=>x!==c);save();config()}
function reportPDF(id){let i=db.incidents.find(x=>x.id===id),name=`${i.work} - ${i.title} - ${i.no}.pdf`;if(!window.jspdf)return alert('Para generar PDF se necesita conexión en la primera carga.');let {jsPDF}=window.jspdf,d=new jsPDF({format:'a4'}),g=[93,133,111];d.setTextColor(...g);d.setFont('helvetica','bold');d.setFontSize(18);d.text('PERLENTAUCHER',20,18);d.setFontSize(10);d.text('INFORME DE INCIDENCIA',20,25);d.setTextColor(30);d.setFontSize(15);d.text(`${i.work} - ${i.no}`,20,39);d.setFontSize(12);d.text(d.splitTextToSize(i.title,170),20,47);d.setFontSize(8);let y=60;[['Categoría',i.category],['Zona',i.zone],['Ubicación',i.location],['Responsable',i.responsible],['Estado',i.status],['Prioridad',i.priority]].forEach((x,k)=>{let col=k%3,row=Math.floor(k/3);d.setFont('helvetica','bold');d.text(x[0].toUpperCase(),20+col*58,y+row*12);d.setFont('helvetica','normal');d.text(String(x[1]||'—'),20+col*58,y+5+row*12)});y=90;d.setFont('helvetica','bold');d.setFontSize(10);d.text('DESCRIPCIÓN',20,y);d.setFont('helvetica','normal');d.setFontSize(10);d.text(d.splitTextToSize(i.description||'',170),20,y+7);d.setFontSize(8);d.text(`Realizado por: ${i.author} · ${i.date}`,20,285);d.save(name)}
function reportWord(id){let i=db.incidents.find(x=>x.id===id),name=`${i.work} - ${i.title} - ${i.no}.doc`,html=`<html><head><meta charset=utf-8><style>body{font-family:Arial;margin:40px}h1,h3{color:#5d856f}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}</style></head><body><h1>PERLENTAUCHER</h1><h3>INFORME DE INCIDENCIA</h3><h2>${esc(i.work)} - ${i.no}<br>${esc(i.title)}</h2><table><tr><td>Categoría: ${esc(i.category||'—')}</td><td>Zona: ${esc(i.zone||'—')}</td><td>Ubicación: ${esc(i.location||'—')}</td></tr><tr><td>Responsable: ${esc(i.responsible||'—')}</td><td>Estado: ${esc(i.status)}</td><td>Prioridad: ${esc(i.priority)}</td></tr></table><h3>Descripción</h3><p>${esc(i.description||'')}</p><h3>Seguimiento</h3>${i.history.map(h=>`<p><b>${esc(h.date)} · ${esc(h.author)}</b><br>${esc(h.text)}</p>`).join('')}</body></html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/msword'}));a.download=name;a.click()}
function closeModal(){$('#modal').classList.add('hidden')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();

<style>

<script>
const KEY='pt_suite_v2';
const SUPABASE_URL='https://preszumlffqsxwwzymzp.supabase.co';
const SUPABASE_KEY='sb_publishable_QJcm6as9LjZkmiCyfvATHA_e3u8tiFT';
const seed={user:'Administrador',works:[],categories:[],incidents:[],plans:[],minutes:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);
let syncBusy=false,lastRemote='';
const apiHeaders={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function localSave(){localStorage.setItem(KEY,JSON.stringify(db));}
async function pushCloud(){if(syncBusy)return;syncBusy=true;try{localSave();let body=JSON.stringify({id:1,data:db,updated_at:new Date().toISOString()});let r=await fetch(SUPABASE_URL+'/rest/v1/app_state?on_conflict=id',{method:'POST',headers:{...apiHeaders,'Prefer':'resolution=merge-duplicates,return=minimal'},body});if(!r.ok)throw new Error(await r.text());lastRemote=JSON.stringify(db);setSync('Sincronizado');}catch(e){console.error(e);setSync('Sin conexión');}finally{syncBusy=false;}}
function save(){localSave();pushCloud();}
async function pullCloud(first=false){if(syncBusy)return;try{let r=await fetch(SUPABASE_URL+'/rest/v1/app_state?id=eq.1&select=data,updated_at',{headers:apiHeaders,cache:'no-store'});if(!r.ok)throw new Error(await r.text());let rows=await r.json();if(!rows.length){if(first)await pushCloud();return;}let remote=rows[0].data||seed,rs=JSON.stringify(remote);if(rs!==lastRemote&&rs!==JSON.stringify(db)){db=remote;localSave();lastRemote=rs;setSync('Sincronizado');render(currentView);}else{lastRemote=rs;setSync('Sincronizado');}}catch(e){console.error(e);setSync('Sin conexión');}}
let currentView='dashboard';
function setSync(t){let el=document.getElementById('syncState');if(el)el.textContent=t;}
const $=s=>document.querySelector(s);const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const navs=[['dashboard','▦','Resumen'],['obras','⌂','Obras'],['incidencias','⚠','Incidencias'],['planos','▱','Planos'],['actas','☷','Actas'],['listados','⇩','Listados'],['config','⚙','Config.']];$('#nav').innerHTML=navs.map((n,i)=>`<button data-view="${n[0]}" class="${i?'':'active'}">${n[1]} &nbsp;<span>${n[2]}</span></button>`).join('');$('#mobilebar').innerHTML=navs.slice(0,5).map(n=>`<button data-view="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));
const titles={dashboard:['Resumen','Control general de obras e incidencias'],obras:['Obras','Crea y administra las obras'],incidencias:['Incidencias','Seguimiento, documentación y trazabilidad'],planos:['Planos','Biblioteca de planos asociada a cada obra'],actas:['Actas','Agrupa incidencias en actas de obra'],listados:['Listados y exportación','Filtra y exporta a Excel'],config:['Configuración','Usuario y categorías']};function render(v='dashboard'){currentView=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#viewTitle').textContent=titles[v][0];$('#viewSub').textContent=titles[v][1];$('#userChip').textContent='Usuario: '+db.user;({dashboard,obras,incidencias,planos,actas,listados,config}[v])()}
const worksOpts=()=>db.works.map(w=>`<option>${esc(w)}</option>`).join(''),catsOpts=()=>db.categories.map(c=>`<option>${esc(c)}</option>`).join('');function nextNo(w){return String(Math.max(0,...db.incidents.filter(i=>i.work===w).map(i=>+i.no||0))+1).padStart(3,'0')}function dashboard(){let s=x=>db.incidents.filter(i=>i.status===x).length;$('#content').innerHTML=`<div class=grid><div class=stat><b>${db.works.length}</b><span>Obras</span></div><div class=stat><b>${db.incidents.length}</b><span>Incidencias</span></div><div class=stat><b>${s('Pendiente')}</b><span>Pendientes</span></div><div class=stat><b>${s('En proceso')}</b><span>En proceso</span></div></div><div class=card><div class=cardhead><h2>Incidencias recientes</h2><button class="btn primary no-print" onclick="openIncident()">+ Nueva incidencia</button></div>${incidentTable(db.incidents.slice(-8).reverse())}</div>`}
function obras(){let r=db.works.map(w=>`<tr><td><b>${esc(w)}</b></td><td>${db.incidents.filter(i=>i.work===w).length}</td><td>${db.plans.filter(p=>p.work===w).length}</td><td><button class="btn ghost" onclick="openIncident('${esc(w)}')">Nueva incidencia</button> <button class="btn danger" onclick="delWork('${esc(w)}')">Quitar</button></td></tr>`).join('');$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Obras</h2><div class=toolbar><input id=newWork placeholder="Nombre de la obra"><button class="btn primary" onclick=addWork()>+ Añadir</button></div></div>${r?`<table><thead><tr><th>Obra</th><th>Incidencias</th><th>Planos</th><th></th></tr></thead><tbody>${r}</tbody></table>`:'<div class=empty>No hay obras. La lista comienza vacía.</div>'}</div>`}function addWork(){let v=$('#newWork').value.trim();if(v&&!db.works.includes(v)){db.works.push(v);save();obras()}}function delWork(w){if(db.incidents.some(i=>i.work===w)||db.plans.some(p=>p.work===w))return alert('No se puede quitar: contiene incidencias o planos.');if(confirm('¿Quitar obra?')){db.works=db.works.filter(x=>x!==w);save();obras()}}
function incidentTable(a){if(!a.length)return '<div class=empty>No hay incidencias.</div>';return `<table><thead><tr><th>Nº</th><th>Obra / título</th><th>Categoría</th><th>Zona</th><th>Estado</th><th>Prioridad</th><th>Actualizada</th></tr></thead><tbody>${a.map(i=>`<tr onclick="showIncident('${i.id}')" style="cursor:pointer"><td><b>${i.no}</b></td><td><b>${esc(i.work)}</b><br>${esc(i.title)}</td><td>${esc(i.category||'—')}</td><td>${esc(i.zone||'—')}</td><td><span class=pill>${esc(i.status)}</span></td><td>${esc(i.priority)}</td><td>${esc(i.updated||i.date)}</td></tr>`).join('')}</tbody></table>`}
function incidencias(){let f=`<div class=toolbar><select id=fw onchange=filterInc()><option value="">Todas las obras</option>${worksOpts()}</select><select id=fc onchange=filterInc()><option value="">Todas las categorías</option>${catsOpts()}</select><select id=fs onchange=filterInc()><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select><input id=fq oninput=filterInc() placeholder="Buscar..."></div>`;$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Incidencias</h2>${f}</div><div id=incTable>${incidentTable(db.incidents)}</div></div>`}function filterInc(){let w=$('#fw').value,c=$('#fc').value,s=$('#fs').value,q=$('#fq').value.toLowerCase();$('#incTable').innerHTML=incidentTable(db.incidents.filter(i=>(!w||i.work===w)&&(!c||i.category===c)&&(!s||i.status===s)&&(!q||JSON.stringify(i).toLowerCase().includes(q))))}
let pendingFiles=[];function openIncident(work=''){if(!db.works.length)return alert('Primero añade una obra.');pendingFiles=[];$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Nueva incidencia</h2><button class=x onclick=closeModal()>×</button></div><div class=formgrid><div class=field><label>Obra</label><select id=iw>${worksOpts()}</select></div><div class="field span2"><label>Título</label><input id=it placeholder="Título del informe"></div><div class=field><label>Fecha</label><input id=idate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Categoría</label><select id=ic><option value="">Sin categoría</option>${catsOpts()}</select></div><div class=field><label>Zona</label><input id=iz></div><div class=field><label>Ubicación</label><input id=il></div><div class=field><label>Responsable</label><input id=ir></div><div class=field><label>Estado</label><select id=is><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class=field><label>Prioridad</label><select id=ip><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div><div class="field span3"><label>Descripción</label><textarea id=ides rows=7></textarea></div><div class="field span3"><label>Fotografías y documentos</label><div class=drop id=incDrop>Arrastra y suelta aquí fotografías/PDF o pulsa para seguir la ruta del archivo<input id=ifiles type=file multiple accept="image/*,.pdf" hidden></div><div id=incFiles class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn ghost" onclick=closeModal()>Cancelar</button><button class="btn primary" onclick=saveIncident()>Crear incidencia</button></div></div>`;$('#iw').value=work||db.works[0];wireDrop('incDrop','ifiles',fs=>{pendingFiles=[...pendingFiles,...fs].map(f=>({name:f.name,type:f.type,size:f.size}));$('#incFiles').innerHTML=pendingFiles.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}
function wireDrop(dropId,inputId,cb){let d=$('#'+dropId),i=$('#'+inputId);d.onclick=()=>i.click();i.onchange=()=>cb([...i.files]);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>cb([...e.dataTransfer.files]))}
function saveIncident(){let w=$('#iw').value,t=$('#it').value.trim();if(!t)return alert('Escribe un título.');let d=$('#idate').value,i={id:uid(),no:nextNo(w),work:w,title:t,date:d,updated:d,category:$('#ic').value,zone:$('#iz').value,location:$('#il').value,responsible:$('#ir').value,status:$('#is').value,priority:$('#ip').value,description:$('#ides').value,author:db.user,files:pendingFiles,planCapture:null,history:[{date:d,author:db.user,text:'Incidencia creada',status:$('#is').value,files:[]}]};db.incidents.push(i);save();closeModal();render('incidencias')}
function showIncident(id){let i=db.incidents.find(x=>x.id===id);$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><div><h2>${esc(i.work)} - ${i.no}</h2><div class=note>${esc(i.title)}</div></div><button class=x onclick=closeModal()>×</button></div><div class=toolbar style="margin:12px 0"><button class="btn primary" onclick="followUp('${id}')">+ Añadir seguimiento</button><button class="btn ghost" onclick="editIncident('${id}')">Editar datos</button><button class="btn ghost" onclick="reportPDF('${id}')">PDF</button><button class="btn ghost" onclick="reportWord('${id}')">Word</button></div><div class=grid style="grid-template-columns:repeat(3,1fr)"><div class=stat><span>Estado</span><b style="font-size:16px">${esc(i.status)}</b></div><div class=stat><span>Categoría</span><b style="font-size:16px">${esc(i.category||'—')}</b></div><div class=stat><span>Responsable</span><b style="font-size:16px">${esc(i.responsible||'—')}</b></div></div><div class=card><b>Descripción</b><p>${esc(i.description||'—')}</p><div class=note>Zona: ${esc(i.zone||'—')} · Ubicación: ${esc(i.location||'—')} · Realizado por: ${esc(i.author)}</div>${i.files?.length?`<div class=files>${i.files.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div><div class=card><div class=cardhead><h2>Historial</h2></div><div class=timeline>${i.history.slice().reverse().map(h=>`<div class=event><b>${esc(h.text)}</b><br><small>${esc(h.date)} · ${esc(h.author)} · ${esc(h.status||'')}</small>${h.files?.length?`<div class=files>${h.files.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div>`).join('')}</div></div></div>`}
function followUp(id){let i=db.incidents.find(x=>x.id===id);$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Seguimiento - ${i.no}</h2><button class=x onclick="showIncident('${id}')">×</button></div><div class=formgrid><div class=field><label>Fecha</label><input id=fdate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Estado</label><select id=fstatus><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class="field span3"><label>Comentario</label><textarea id=ftext rows=6></textarea></div><div class="field span3"><label>Nuevas fotos/documentos</label><div class=drop id=followDrop>Arrastra y suelta o pulsa para elegir archivos<input id=followFiles type=file multiple accept="image/*,.pdf" hidden></div><div id=followNames class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn primary" onclick="saveFollow('${id}')">Guardar seguimiento</button></div></div>`;$('#fstatus').value=i.status;window.followPending=[];wireDrop('followDrop','followFiles',fs=>{followPending=[...followPending,...fs].map(f=>({name:f.name,type:f.type,size:f.size}));$('#followNames').innerHTML=followPending.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}function saveFollow(id){let i=db.incidents.find(x=>x.id===id),d=$('#fdate').value,t=$('#ftext').value.trim();if(!t)return alert('Añade un comentario.');i.status=$('#fstatus').value;i.updated=d;i.history.push({date:d,author:db.user,text:t,status:i.status,files:followPending});save();showIncident(id)}
function editIncident(id){let i=db.incidents.find(x=>x.id===id),t=prompt('Título:',i.title);if(t!==null)i.title=t.trim()||i.title;let r=prompt('Responsable:',i.responsible||'');if(r!==null)i.responsible=r;save();showIncident(id)}
function planos(){let w=db.works[0]||'';$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Biblioteca de planos</h2><select id=pw onchange=renderPlans()>${worksOpts()}</select></div><div class=drop id=planDrop>Arrastra y suelta planos PDF aquí o pulsa para seguir la ruta y seleccionarlos<input id=planFiles type=file multiple accept="application/pdf,.pdf" hidden></div><div id=plans style="margin-top:12px"></div></div>`;if(w){wireDrop('planDrop','planFiles',addPlanFiles);renderPlans()}else $('#plans').innerHTML='<div class=empty>Crea una obra antes de añadir planos.</div>'}function addPlanFiles(fs){let w=$('#pw').value;fs.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')).forEach(f=>db.plans.push({id:uid(),work:w,name:f.name,rev:'01',date:new Date().toISOString().slice(0,10),size:f.size}));save();renderPlans()}function renderPlans(){let w=$('#pw').value,a=db.plans.filter(p=>p.work===w);$('#plans').innerHTML=a.length?a.map(p=>`<div class=plan><div><b>${esc(p.name)}</b><br><span class=note>Rev. ${esc(p.rev)} · ${p.date}</span></div><div><button class="btn ghost" onclick="updatePlan('${p.id}')">Actualizar</button> <button class="btn ghost" onclick="markPlan('${p.id}')">Localizar</button> <button class="btn danger" onclick="delPlan('${p.id}')">Quitar</button></div></div>`).join(''):'<div class=empty>Esta obra todavía no tiene planos.</div>'}function updatePlan(id){let p=db.plans.find(x=>x.id===id),r=prompt('Nueva revisión:',p.rev);if(r){p.rev=r;p.date=new Date().toISOString().slice(0,10);save();renderPlans()}}function delPlan(id){if(confirm('¿Quitar plano?')){db.plans=db.plans.filter(x=>x.id!==id);save();renderPlans()}}function markPlan(id){alert('Flujo de localización: seleccionar plano → abrir página → zoom/desplazar → fijar vista → marcar con dedo/ratón → guardar captura en la incidencia. La interfaz queda reservada para el visor PDF del despliegue conectado.');}
function actas(){let r=db.minutes.map(m=>`<tr><td>${m.no}</td><td><b>${esc(m.work)}</b><br>${esc(m.title)}</td><td>${m.date}</td><td>${m.incidents.length}</td><td>${esc(m.author)}</td></tr>`).join('');$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Actas</h2><button class="btn primary" onclick=createMinute()>+ Crear acta</button></div>${r?`<table><thead><tr><th>Nº</th><th>Acta</th><th>Fecha</th><th>Incidencias</th><th>Autor</th></tr></thead><tbody>${r}</tbody></table>`:'<div class=empty>No hay actas.</div>'}</div>`}function createMinute(){if(!db.works.length)return alert('Primero crea una obra.');let w=prompt('Obra:',db.works[0]);if(!db.works.includes(w))return;let avail=db.incidents.filter(i=>i.work===w);if(!avail.length)return alert('No hay incidencias en esta obra.');let nums=prompt('Números a incluir separados por coma:',avail.map(i=>i.no).join(','));if(!nums)return;let sel=nums.split(',').map(x=>x.trim()),ids=avail.filter(i=>sel.includes(i.no)).map(i=>i.id),title=prompt('Título del acta:','Revisión de obra')||'Revisión de obra';db.minutes.push({id:uid(),no:String(db.minutes.filter(m=>m.work===w).length+1).padStart(3,'0'),work:w,title,date:new Date().toISOString().slice(0,10),incidents:ids,author:db.user});save();actas()}
function listados(){$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Listado general</h2><div class=toolbar><button class="btn primary" onclick=exportXLSX()>Exportar Excel</button><button class="btn ghost" onclick=window.print()>Imprimir</button></div></div>${incidentTable(db.incidents)}</div>`}function exportXLSX(){let rows=db.incidents.map(i=>({'Nº':i.no,'Obra':i.work,'Título':i.title,'Categoría':i.category,'Zona':i.zone,'Ubicación':i.location,'Responsable':i.responsible,'Estado':i.status,'Prioridad':i.priority,'Fecha':i.date,'Actualizada':i.updated,'Realizado por':i.author}));if(window.XLSX){let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Incidencias');XLSX.writeFile(wb,'PERLENTAUCHER_Incidencias.xlsx')}else exportCSV(rows)}function exportCSV(rows){let h=Object.keys(rows[0]||{'Nº':''}),csv='\ufeff'+[h,...rows.map(Object.values)].map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PERLENTAUCHER_Incidencias.csv';a.click()}
function config(){$('#content').innerHTML=`<div class=card><h2>Usuario actual</h2><div class=toolbar><input id=uname value="${esc(db.user)}"><button class="btn primary" onclick="db.user=$('#uname').value.trim()||'Usuario';save();render('config')">Guardar</button></div></div><div class=card><div class=cardhead><h2>Categorías</h2><div class=toolbar><input id=newCat placeholder="Nueva categoría"><button class="btn primary" onclick=addCat()>+ Añadir</button></div></div>${db.categories.length?db.categories.map(c=>`<span class=filechip>${esc(c)} <button onclick="delCat('${esc(c)}')" style="border:0;background:transparent">×</button></span>`).join(''):'<div class=empty>Las categorías comienzan vacías.</div>'}</div><div class=card><b>Sincronización multiusuario</b><p class=note>La aplicación está preparada como PWA de escritorio y móvil. Para sincronización real entre compañeros hace falta publicar esta carpeta en HTTPS y conectar un backend/base de datos común. Las credenciales del servicio no se incluyen en el paquete por seguridad.</p></div>`}function addCat(){let v=$('#newCat').value.trim();if(v&&!db.categories.includes(v)){db.categories.push(v);save();config()}}function delCat(c){if(db.incidents.some(i=>i.category===c))return alert('Categoría en uso.');db.categories=db.categories.filter(x=>x!==c);save();config()}
function reportPDF(id){let i=db.incidents.find(x=>x.id===id),name=`${i.work} - ${i.title} - ${i.no}.pdf`;if(!window.jspdf)return alert('Para generar PDF se necesita conexión en la primera carga.');let {jsPDF}=window.jspdf,d=new jsPDF({format:'a4'}),g=[93,133,111];d.setTextColor(...g);d.setFont('helvetica','bold');d.setFontSize(18);d.text('PERLENTAUCHER',20,18);d.setFontSize(10);d.text('INFORME DE INCIDENCIA',20,25);d.setTextColor(30);d.setFontSize(15);d.text(`${i.work} - ${i.no}`,20,39);d.setFontSize(12);d.text(d.splitTextToSize(i.title,170),20,47);d.setFontSize(8);let y=60;[['Categoría',i.category],['Zona',i.zone],['Ubicación',i.location],['Responsable',i.responsible],['Estado',i.status],['Prioridad',i.priority]].forEach((x,k)=>{let col=k%3,row=Math.floor(k/3);d.setFont('helvetica','bold');d.text(x[0].toUpperCase(),20+col*58,y+row*12);d.setFont('helvetica','normal');d.text(String(x[1]||'—'),20+col*58,y+5+row*12)});y=90;d.setFont('helvetica','bold');d.setFontSize(10);d.text('DESCRIPCIÓN',20,y);d.setFont('helvetica','normal');d.setFontSize(10);d.text(d.splitTextToSize(i.description||'',170),20,y+7);d.setFontSize(8);d.text(`Realizado por: ${i.author} · ${i.date}`,20,285);d.save(name)}
function reportWord(id){let i=db.incidents.find(x=>x.id===id),name=`${i.work} - ${i.title} - ${i.no}.doc`,html=`<html><head><meta charset=utf-8><style>body{font-family:Arial;margin:40px}h1,h3{color:#5d856f}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}</style></head><body><h1>PERLENTAUCHER</h1><h3>INFORME DE INCIDENCIA</h3><h2>${esc(i.work)} - ${i.no}<br>${esc(i.title)}</h2><table><tr><td>Categoría: ${esc(i.category||'—')}</td><td>Zona: ${esc(i.zone||'—')}</td><td>Ubicación: ${esc(i.location||'—')}</td></tr><tr><td>Responsable: ${esc(i.responsible||'—')}</td><td>Estado: ${esc(i.status)}</td><td>Prioridad: ${esc(i.priority)}</td></tr></table><h3>Descripción</h3><p>${esc(i.description||'')}</p><h3>Seguimiento</h3>${i.history.map(h=>`<p><b>${esc(h.date)} · ${esc(h.author)}</b><br>${esc(h.text)}</p>`).join('')}</body></html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/msword'}));a.download=name;a.click()}
function closeModal(){$('#modal').classList.add('hidden')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();pullCloud(true);setInterval(()=>pullCloud(false),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullCloud(false)});
</script></body></html>
