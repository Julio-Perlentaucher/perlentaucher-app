<script>

  async function uploadStorage(file){
  const safeName=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path='seguimientos/'+safeName;
  const r=await fetch(SUPABASE_URL+'/storage/v1/object/archivos-obra/'+path,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':file.type||'application/octet-stream'
    },
    body:file
  });
  if(!r.ok)throw new Error(await r.text());
  return {
    name:file.name,
    type:file.type,
    size:file.size,
    url:SUPABASE_URL+'/storage/v1/object/public/archivos-obra/'+path
  };
}
async function uploadPlanStorage(file){
  const safeName=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path='planos/'+safeName;

  const r=await fetch(SUPABASE_URL+'/storage/v1/object/archivos-obra/'+path,{
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':file.type||'application/pdf'
    },
    body:file
  });

  if(!r.ok)throw new Error(await r.text());

  return {
    name:file.name,
    type:file.type,
    size:file.size,
    url:SUPABASE_URL+'/storage/v1/object/public/archivos-obra/'+path
  };
}  
function save(){localSave();pushCloud();}
async function pullCloud(first=false){if(syncBusy)return;try{let r=await fetch(SUPABASE_URL+'/rest/v1/app_state?id=eq.1&select=data,updated_at',{headers:apiHeaders,cache:'no-store'});if(!r.ok)throw new Error(await r.text());let rows=await r.json();if(!rows.length){if(first)await pushCloud();return;}let remote=rows[0].data||seed,rs=JSON.stringify(remote);if(rs!==lastRemote&&rs!==JSON.stringify(db)){db=remote;localSave();lastRemote=rs;setSync('Sincronizado');render(currentView);}else{lastRemote=rs;setSync('Sincronizado');}}catch(e){console.error(e);setSync('Sin conexión');}}
let currentView='dashboard';
function setSync(t){let el=document.getElementById('syncState');if(el)el.textContent=t;}
const $=s=>document.querySelector(s);const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const navs=[['dashboard','▦','Resumen'],['obras','⌂','Obras'],['incidencias','⚠','Incidencias'],['planos','▱','Planos'],['actas','☷','Actas'],['listados','⇩','Listados'],['informes','▤','Informes'],['config','⚙','Config.']];$('#nav').innerHTML=navs.map((n,i)=>`<button data-view="${n[0]}" class="${i?'':'active'}">${n[1]} &nbsp;<span>${n[2]}</span></button>`).join('');$('#mobilebar').innerHTML=navs.slice(0,5).map(n=>`<button data-view="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));
const titles={dashboard:['Resumen','Control general de obras e incidencias'],obras:['Obras','Crea y administra las obras'],incidencias:['Incidencias','Seguimiento, documentación y trazabilidad'],planos:['Planos','Biblioteca de planos asociada a cada obra'],actas:['Actas','Agrupa incidencias en actas de obra'],listados:['Listados y exportación','Filtra y exporta a Excel'],informes:['Informes','Genera informes de obra e incidencias'],config:['Configuración','Usuario y categorías']};function render(v='dashboard'){currentView=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#viewTitle').textContent=titles[v][0];$('#viewSub').textContent=titles[v][1];$('#userChip').textContent='Usuario: '+db.user;({dashboard,obras,incidencias,planos,actas,listados,informes,config}[v])()}
const worksOpts=()=>db.works.map(w=>`<option>${esc(w)}</option>`).join(''),catsOpts=()=>db.categories.map(c=>`<option>${esc(c)}</option>`).join('');function nextNo(w){db.numberCounters=db.numberCounters||{};let n=Math.max(0,...db.incidents.filter(i=>i.work===w).map(i=>+i.no||0),+(db.numberCounters[w]||0))+1;db.numberCounters[w]=n;return String(n).padStart(3,'0')}function dashboard(){let s=x=>db.incidents.filter(i=>i.status===x).length;$('#content').innerHTML=`<div class=grid><div class=stat><b>${db.works.length}</b><span>Obras</span></div><div class=stat><b>${db.incidents.length}</b><span>Incidencias</span></div><div class=stat><b>${s('Pendiente')}</b><span>Pendientes</span></div><div class=stat><b>${s('En proceso')}</b><span>En proceso</span></div></div><div class=card><div class=cardhead><h2>Incidencias recientes</h2><button class="btn primary no-print" onclick="openIncident()">+ Nueva incidencia</button></div>${incidentTable(db.incidents.slice(-8).reverse())}</div>`}
function obras(){let r=db.works.map(w=>`<tr><td><b>${esc(w)}</b></td><td>${db.incidents.filter(i=>i.work===w).length}</td><td>${db.plans.filter(p=>p.work===w).length}</td><td><button class="btn ghost" onclick="openIncident('${esc(w)}')">Nueva incidencia</button> <button class="btn danger" onclick="delWork('${esc(w)}')">Quitar</button></td></tr>`).join('');$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Obras</h2><div class=toolbar><input id=newWork placeholder="Nombre de la obra"><button class="btn primary" onclick=addWork()>+ Añadir</button></div></div>${r?`<table><thead><tr><th>Obra</th><th>Incidencias</th><th>Planos</th><th></th></tr></thead><tbody>${r}</tbody></table>`:'<div class=empty>No hay obras. La lista comienza vacía.</div>'}</div>`}function addWork(){let v=$('#newWork').value.trim();if(v&&!db.works.includes(v)){db.works.push(v);save();obras()}}function delWork(w){if(db.incidents.some(i=>i.work===w)||db.plans.some(p=>p.work===w))return alert('No se puede quitar: contiene incidencias o planos.');if(confirm('¿Quitar obra?')){db.works=db.works.filter(x=>x!==w);save();obras()}}
function incidentTable(a){if(!a.length)return '<div class=empty>No hay incidencias.</div>';return `<table><thead><tr><th>Nº</th><th>Obra / título</th><th>Categoría</th><th>Zona</th><th>Estado</th><th>Prioridad</th><th>Actualizada</th></tr></thead><tbody>${a.map(i=>`<tr onclick="showIncident('${i.id}')" style="cursor:pointer"><td><b>${i.no}</b></td><td><b>${esc(i.work)}</b><br>${esc(i.title)}</td><td>${esc(i.category||'—')}</td><td>${esc(i.zone||'—')}</td><td><span class=pill>${esc(i.status)}</span></td><td>${esc(i.priority)}</td><td>${esc(i.updated||i.date)}</td></tr>`).join('')}</tbody></table>`}
function incidencias(){let f=`<div class=toolbar><select id=fw onchange=filterInc()><option value="">Todas las obras</option>${worksOpts()}</select><select id=fc onchange=filterInc()><option value="">Todas las categorías</option>${catsOpts()}</select><select id=fs onchange=filterInc()><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select><input id=fq oninput=filterInc() placeholder="Buscar..."></div>`;$('#content').innerHTML=`<div class=card><div class=cardhead><h2>Incidencias</h2>${f}</div><div id=incTable>${incidentTable(db.incidents)}</div></div>`}function filterInc(){let w=$('#fw').value,c=$('#fc').value,s=$('#fs').value,q=$('#fq').value.toLowerCase();$('#incTable').innerHTML=incidentTable(db.incidents.filter(i=>(!w||i.work===w)&&(!c||i.category===c)&&(!s||i.status===s)&&(!q||JSON.stringify(i).toLowerCase().includes(q))))}
let pendingFiles=[];function openIncident(work=''){if(!db.works.length)return alert('Primero añade una obra.');pendingFiles=[];$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Nueva incidencia</h2><button class=x onclick=closeModal()>×</button></div><div class=formgrid><div class=field><label>Obra</label><select id=iw>${worksOpts()}</select></div><div class="field span2"><label>Título</label><input id=it placeholder="Título del informe"></div><div class=field><label>Fecha</label><input id=idate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Categoría</label><select id=ic><option value="">Sin categoría</option>${catsOpts()}</select></div><div class=field><label>Zona</label><input id=iz></div><div class=field><label>Ubicación</label><input id=il></div><div class=field><label>Responsable</label><input id=ir></div><div class=field><label>Estado</label><select id=is><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class=field><label>Prioridad</label><select id=ip><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div><div class="field span3"><label>Descripción</label><textarea id=ides rows=7></textarea></div><div class="field span3"><label>Fotografías y documentos</label><div class=drop id=incDrop>Arrastra y suelta aquí fotografías/PDF o pulsa para seguir la ruta del archivo<input id=ifiles type=file multiple accept="image/*,.pdf" hidden></div><div id=incFiles class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn ghost" onclick=closeModal()>Cancelar</button><button class="btn primary" onclick=saveIncident()>Crear incidencia</button></div></div>`;$('#iw').value=work||db.works[0];wireDrop('incDrop','ifiles',fs=>{pendingFiles=[...pendingFiles,...fs].map(f=>({name:f.name,type:f.type,size:f.size}));$('#incFiles').innerHTML=pendingFiles.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}
function wireDrop(dropId,inputId,cb){let d=$('#'+dropId),i=$('#'+inputId);d.onclick=()=>i.click();i.onchange=()=>cb([...i.files]);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>cb([...e.dataTransfer.files]))}
function saveIncident(){let w=$('#iw').value,t=$('#it').value.trim();if(!t)return alert('Escribe un título.');let d=$('#idate').value,i={id:uid(),no:nextNo(w),work:w,title:t,date:d,updated:d,category:$('#ic').value,zone:$('#iz').value,location:$('#il').value,responsible:$('#ir').value,status:$('#is').value,priority:$('#ip').value,description:$('#ides').value,author:db.user,files:pendingFiles,planCapture:null,history:[{date:d,author:db.user,text:'Incidencia creada',status:$('#is').value,files:[]}]};db.incidents.push(i);save();closeModal();render('incidencias')}
function showIncident(id){let i=db.incidents.find(x=>x.id===id);$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><div><h2>${esc(i.work)} - ${i.no}</h2><div class=note>${esc(i.title)}</div></div><button class=x onclick=closeModal()>×</button></div><div class=toolbar style="margin:12px 0"><button class="btn primary" onclick="followUp('${id}')">+ Añadir seguimiento</button><button class="btn ghost" onclick="editIncident('${id}')">Editar datos</button><button class="btn ghost" onclick="reportPDF('${id}')">PDF</button><button class="btn ghost" onclick="reportWord('${id}')">Word</button></div><div class=grid style="grid-template-columns:repeat(3,1fr)"><div class=stat><span>Estado</span><b style="font-size:16px">${esc(i.status)}</b></div><div class=stat><span>Categoría</span><b style="font-size:16px">${esc(i.category||'—')}</b></div><div class=stat><span>Responsable</span><b style="font-size:16px">${esc(i.responsible||'—')}</b></div></div><div class=card><b>Descripción</b><p>${esc(i.description||'—')}</p><div class=note>Zona: ${esc(i.zone||'—')} · Ubicación: ${esc(i.location||'—')} · Realizado por: ${esc(i.author)}</div>${i.files?.length?`<div class=files>${i.files.map(f=>f.url&&f.type&&f.type.startsWith('image/')?`<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="${esc(f.name)}" style="max-width:240px;max-height:180px;object-fit:cover;border-radius:8px;display:block;margin:6px 0"></a>`:f.url?`<a class="filechip" href="${esc(f.url)}" target="_blank">${esc(f.name)}</a>`:`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div><div class=card><div class=cardhead><h2>Historial</h2></div><div class=timeline>${i.history.slice().reverse().map(h=>`<div class=event><b>${esc(h.text)}</b><br><small>${esc(h.date)} · ${esc(h.author)} · ${esc(h.status||'')}</small>${h.files?.length?`<div class=files>${h.files.map(f=>f.url&&f.type&&f.type.startsWith('image/')?`<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="${esc(f.name)}" style="max-width:240px;max-height:180px;object-fit:cover;border-radius:8px;display:block;margin:6px 0"></a>`:f.url?`<a class="filechip" href="${esc(f.url)}" target="_blank">${esc(f.name)}</a>`:`<span class=filechip>${esc(f.name)}</span>`).join('')}</div>`:''}</div>`).join('')}</div></div></div>`}
function followUp(id){let i=db.incidents.find(x=>x.id===id);$('#modal').innerHTML=`<div class=modalbox><div class=modalhead><h2>Seguimiento - ${i.no}</h2><button class=x onclick="showIncident('${id}')">×</button></div><div class=formgrid><div class=field><label>Fecha</label><input id=fdate type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Estado</label><select id=fstatus><option>Pendiente</option><option>En proceso</option><option>Solucionada</option><option>Cerrada</option></select></div><div class="field span3"><label>Comentario</label><textarea id=ftext rows=6></textarea></div><div class="field span3"><label>Nuevas fotos/documentos</label><div class=drop id=followDrop>Arrastra y suelta o pulsa para elegir archivos<input id=followFiles type=file multiple accept="image/*,.pdf" hidden></div><div id=followNames class=files></div></div></div><div class=toolbar style="justify-content:flex-end;margin-top:15px"><button class="btn primary" onclick="saveFollow('${id}')">Guardar seguimiento</button></div></div>`;$('#fstatus').value=i.status;window.followPending=[];wireDrop('followDrop','followFiles',fs=>{followPending=[...followPending,...fs];$('#followNames').innerHTML=followPending.map(f=>`<span class=filechip>${esc(f.name)}</span>`).join('')})}async function saveFollow(id){
  let i=db.incidents.find(x=>x.id===id),
      d=$('#fdate').value,
      t=$('#ftext').value.trim();

  if(!t)return alert('Añade un comentario.');

  try{
    setSync('Subiendo archivos...');

    const files=[];
    for(const file of followPending){
      files.push(await uploadStorage(file));

async function renderPlanCapture(cap){
  if(!cap||!window.pdfjsLib)return null;
  const plan=db.plans.find(p=>p.id===cap.planId);
  const url=cap.planUrl||(plan&&plan.url);
  if(!url)return null;
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument(url).promise;
    const pageNo=Math.min(pdf.numPages,Math.max(1,+cap.page||1));
    const page=await pdf.getPage(pageNo);
    const viewport=page.getViewport({scale:1.5});
    const c=document.createElement('canvas'),ctx=c.getContext('2d');
    c.width=viewport.width;c.height=viewport.height;
    await page.render({canvasContext:ctx,viewport}).promise;
    if(Number.isFinite(+cap.x)&&Number.isFinite(+cap.y)){
      const x=+cap.x*c.width,y=+cap.y*c.height,r=Math.max(10,c.width*.012);
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='rgba(211,47,47,.22)';ctx.fill();ctx.lineWidth=Math.max(4,r*.28);ctx.strokeStyle='#d32f2f';ctx.stroke();

    }
    return {data:c.toDataURL('image/jpeg',.86),width:c.width,height:c.height,page:pageNo};
  }catch(e){console.error('No se pudo preparar el plano para el informe',e);return null;}
}

    return;
  }

  let {jsPDF}=window.jspdf;
  let d=new jsPDF({format:'a4'});
  let g=[93,133,111];
  let y=18;

  function checkPage(needed=15){
    if(y+needed>275){
      d.addPage();
      y=18;
    }
  }

  function textBlock(text,size=9){
    d.setFont('helvetica','normal');
    d.setFontSize(size);
    let lines=d.splitTextToSize(String(text||'—'),170);
    checkPage(lines.length*5+5);
    d.text(lines,20,y);
    y+=lines.length*5+5;
  }
  async function loadImage(url){
    try{
      let r=await fetch(url);
      let blob=await r.blob();

      let data=await new Promise((resolve,reject)=>{
        let reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=reject;
        reader.readAsDataURL(blob);
      });

      let img=await new Promise((resolve,reject)=>{
        let el=new Image();
        el.onload=()=>resolve(el);
        el.onerror=reject;
        el.src=data;
      });

      return {data,img};
    }catch(e){
      console.error('No se pudo cargar imagen para el PDF',e);
      return null;
    }
  }
     async function addImages(files){
    let loaded=[];

    for(let f of files){
      let image=await loadImage(f.url);
      if(image)loaded.push(image);
    }

    if(!loaded.length)return;

    if(loaded.length===1){
      let {data,img}=loaded[0];
      let maxW=170,maxH=120;
      let ratio=Math.min(maxW/img.width,maxH/img.height);
      let w=img.width*ratio,h=img.height*ratio;

      checkPage(h+8);
      d.addImage(data,'JPEG',20,y,w,h);
      y+=h+8;
      return;
    }

    let colW=82;
    let gap=6;

    for(let n=0;n<loaded.length;n+=2){
      let pair=loaded.slice(n,n+2);

      let dimensions=pair.map(({img})=>{
        let ratio=Math.min(colW/img.width,75/img.height);
        return {w:img.width*ratio,h:img.height*ratio};
      });

      let rowH=Math.max(...dimensions.map(x=>x.h));
      checkPage(rowH+8);

      pair.forEach(({data},j)=>{
        let dim=dimensions[j];
        let x=20+j*(colW+gap);
        d.addImage(data,'JPEG',x,y,dim.w,dim.h);
      });

      y+=rowH+8;
    }
  }
  d.setTextColor(...g);
  d.setFont('helvetica','bold');
  d.setFontSize(18);
  d.text('PERLENTAUCHER',20,y);

  y+=12;
  d.setFontSize(9);
  d.setFont('helvetica','normal');
  d.text(`Total de incidencias: ${incidents.length}`,20,y);

  y+=12;

  for(let i of incidents){

    d.setDrawColor(210);
    d.line(20,y,190,y);
    y+=7;

    d.setTextColor(...g);
    d.setFont('helvetica','bold');
    d.setFontSize(11);
    d.text(`${i.no} · ${i.title}`,20,y);

    y+=6;
    d.setTextColor(30);
    d.setFontSize(8);
    d.setFont('helvetica','normal');
    d.text(
      `Estado: ${i.status} · Prioridad: ${i.priority} · Responsable: ${i.responsible||'—'}`,
      20,
      y
    );

    y+=6;
    d.text(
      `Zona: ${i.zone||'—'} · Ubicación: ${i.location||'—'} · Actualizada: ${i.updated||i.date}`,
      20,
      y
    );

    y+=8;
    d.setFont('helvetica','bold');
    d.text('Descripción',20,y);
    y+=5;

    textBlock(i.description||'—',9);

    if(i.planCapture){
      let planState={y};
      await addPlanCaptureToPDF(d,i,planState);
      y=planState.y;
    }

    if((i.history||[]).length){
      checkPage(15);

      d.setFont('helvetica','bold');
      d.setFontSize(8);
      d.setTextColor(...g);
      d.text('SEGUIMIENTO',20,y);
      y+=7;

      for(let h of (i.history||[])){
        let lines=d.splitTextToSize(String(h.text||'—'),170);
        checkPage(14+(lines.length*5));

        d.setDrawColor(225);
        d.line(20,y,190,y);
        y+=5;

        d.setFont('helvetica','bold');
        d.setFontSize(8);
        d.setTextColor(30);
        d.text(`${h.date||''} · ${h.author||''} · ${h.status||''}`,20,y);
        y+=5;

        textBlock(h.text||'—',8);
                let imgs=(h.files||[]).filter(f=>f.url&&f.type&&f.type.startsWith('image/'));

        if(imgs.length){
          await addImages(imgs);
        }
      }
    }
    y+=4;
  }

  let pages=d.getNumberOfPages();

  for(let p=1;p<=pages;p++){
    d.setPage(p);
    d.setFont('helvetica','normal');
    d.setFontSize(8);
    d.setTextColor(70);
    d.text(`Generado por: ${db.user}`,20,287);
    d.text(`Página ${p} de ${pages}`,190,287,{align:'right'});
  }

  let name=`${work} - ${category} - Informe por categoria.pdf`;
  d.save(name);
}

// Visor de plano: varias marcas, edición temporal y confirmación explícita.
openPlanViewer=async function(p,incident){
  if(!window.pdfjsLib)return alert('No se ha podido cargar el visor PDF.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const original=incident.planCapture&&incident.planCapture.planId===p.id?structuredClone(incident.planCapture):null;
  let draft=original?structuredClone(original):{planId:p.id,planName:p.name,planRev:p.rev,planDate:p.date,planUrl:p.url,page:1,zoom:1.25,marks:[],view:null};
  if(!Array.isArray(draft.marks))draft.marks=(Number.isFinite(+draft.x)&&Number.isFinite(+draft.y))?[{x:+draft.x,y:+draft.y}]:[];
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class=modalbox><div class=modalhead><div><h2>Localizar incidencia ${esc(incident.no)}</h2><div class=note>${esc(p.name)} · Rev. ${esc(p.rev)}</div></div><button class=x id=cancelPlanX>×</button></div><div class=toolbar style="margin:12px 0"><button class="btn ghost" id=prevPlanPage>← Página</button><span id=planPageInfo>Cargando...</span><button class="btn ghost" id=nextPlanPage>Página →</button><button class="btn ghost" id=zoomOutPlan>− Zoom</button><span id=planZoomInfo></span><button class="btn ghost" id=zoomInPlan>+ Zoom</button></div><div class=note style="margin-bottom:8px">Ajusta el zoom y desplázate hasta la zona. Pulsa sobre el plano para añadir varias marcas. Los cambios solo se guardan al pulsar <b>Aceptar / Guardar localización</b>.</div><div class=annotWrap id=planAnnotWrap style="position:relative"><div id=planStage style="position:relative;display:inline-block"><canvas id=planCanvas style="display:block"></canvas><div id=planMarkers style="position:absolute;inset:0;pointer-events:none"></div></div></div><div class=card style="margin-top:10px"><div class=cardhead><h2>Marcas</h2><button class="btn danger" id=clearPlanMarks>Eliminar todas</button></div><div id=planMarksList class=files></div></div><div class=toolbar style="position:sticky;bottom:0;z-index:5;justify-content:flex-end;margin-top:14px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:#fff"><button class="btn ghost" id=cancelPlan>Cancelar</button><button class="btn primary" id=acceptPlan>✓ Aceptar / Guardar localización</button></div></div>`;
  try{
    const pdf=await pdfjsLib.getDocument(p.url).promise;
    let pageNo=Math.min(pdf.numPages,Math.max(1,+draft.page||1));
    let planScale=Math.min(3,Math.max(.5,+draft.zoom||1.25));
    const canvas=$('#planCanvas'),wrap=$('#planAnnotWrap'),markers=$('#planMarkers');
    let restoreView=draft.view&&+draft.page===pageNo?structuredClone(draft.view):null;
    function marksForPage(){return draft.marks.filter(m=>(+m.page||+draft.page||1)===pageNo)}
    function drawMarkers(){
      markers.innerHTML='';
      draft.marks.forEach((m,idx)=>{if((+m.page||+draft.page||1)!==pageNo)return;let el=document.createElement('div');el.textContent=String(idx+1);el.title='Marca '+(idx+1);el.style.cssText=`position:absolute;left:${(+m.x*100)}%;top:${(+m.y*100)}%;width:28px;height:28px;border:3px solid #d32f2f;background:#fff8;color:#b71c1c;border-radius:50%;transform:translate(-50%,-50%);font-weight:800;line-height:22px;text-align:center;pointer-events:none;box-shadow:0 1px 4px #0005`;markers.appendChild(el)});
      $('#planMarksList').innerHTML=draft.marks.length?draft.marks.map((m,idx)=>`<span class=filechip>Marca ${idx+1} · pág. ${m.page||pageNo} <button type=button onclick="removeDraftPlanMark(${idx})" style="border:0;background:transparent;color:#a94a45;font-weight:bold;cursor:pointer">×</button></span>`).join(''):'<span class=note>No hay marcas todavía.</span>';
    }
    window.removeDraftPlanMark=idx=>{draft.marks.splice(idx,1);drawMarkers()};
    function currentView(){
      // Guardamos el viewport real del contenedor desplazable, normalizado respecto al plano.
      // scrollLeft/scrollTop son más fiables que getBoundingClientRect cuando hay zoom y desplazamiento.
      const cw=Math.max(1,canvas.clientWidth),ch=Math.max(1,canvas.clientHeight);
      const x=Math.max(0,Math.min(1,wrap.scrollLeft/cw));
      const y=Math.max(0,Math.min(1,wrap.scrollTop/ch));
      const w=Math.max(.01,Math.min(1-x,wrap.clientWidth/cw));
      const h=Math.max(.01,Math.min(1-y,wrap.clientHeight/ch));
      return {x,y,w,h};
    }
    async function renderPage(){
      const page=await pdf.getPage(pageNo),viewport=page.getViewport({scale:planScale}),ctx=canvas.getContext('2d');
      canvas.width=viewport.width;canvas.height=viewport.height;
      await page.render({canvasContext:ctx,viewport}).promise;
      $('#planPageInfo').textContent=`Página ${pageNo} de ${pdf.numPages}`;$('#planZoomInfo').textContent=Math.round(planScale*100)+'%';
      drawMarkers();

    }
    $('#prevPlanPage').onclick=async()=>{if(pageNo>1){pageNo--;draft.page=pageNo;restoreView=null;await renderPage()}};
    $('#nextPlanPage').onclick=async()=>{if(pageNo<pdf.numPages){pageNo++;draft.page=pageNo;restoreView=null;await renderPage()}};
    async function changeZoom(next){let center={x:(wrap.scrollLeft+wrap.clientWidth/2)/Math.max(1,canvas.clientWidth),y:(wrap.scrollTop+wrap.clientHeight/2)/Math.max(1,canvas.clientHeight)};planScale=next;draft.zoom=planScale;await renderPage();requestAnimationFrame(()=>{wrap.scrollLeft=Math.max(0,center.x*canvas.clientWidth-wrap.clientWidth/2);wrap.scrollTop=Math.max(0,center.y*canvas.clientHeight-wrap.clientHeight/2)})}
    $('#zoomOutPlan').onclick=()=>planScale>.5&&changeZoom(Math.max(.5,planScale-.25));
    $('#zoomInPlan').onclick=()=>planScale<3&&changeZoom(Math.min(3,planScale+.25));
    canvas.onclick=e=>{const rect=canvas.getBoundingClientRect();draft.marks.push({page:pageNo,x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height});draft.page=pageNo;drawMarkers()};
    $('#clearPlanMarks').onclick=()=>{if(!draft.marks.length)return;if(confirm('¿Eliminar todas las marcas de esta localización?')){draft.marks=[];drawMarkers()}};
    const cancel=()=>{delete window.removeDraftPlanMark;showIncident(incident.id)};$('#cancelPlan').onclick=cancel;$('#cancelPlanX').onclick=cancel;
    $('#acceptPlan').onclick=()=>{if(!draft.marks.length)return alert('Añade al menos una marca antes de guardar.');draft.planId=p.id;draft.planName=p.name;draft.planRev=p.rev;draft.planDate=p.date;draft.planUrl=p.url;draft.page=pageNo;draft.zoom=planScale;draft.view=currentView();delete draft.x;delete draft.y;incident.planCapture=structuredClone(draft);trace(incident,`Localización en plano guardada: ${p.name} · Rev. ${p.rev} · ${draft.marks.length} marca(s)`);save();delete window.removeDraftPlanMark;showIncident(incident.id)};
    await renderPage();
  }catch(e){console.error(e);alert('No se pudo abrir el plano en el visor.');showIncident(incident.id)}
}

      let xs=marks.map(m=>+m.x),ys=marks.map(m=>+m.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=.12;
      let x=Math.max(0,minX-pad),y=Math.max(0,minY-pad),right=Math.min(1,maxX+pad),bottom=Math.min(1,maxY+pad);
      let w=Math.max(.28,right-x),h=Math.max(.28,bottom-y);if(x+w>1)x=Math.max(0,1-w);if(y+h>1)y=Math.max(0,1-h);view={x,y,w:Math.min(1,w),h:Math.min(1,h)};

    return {data:c.toDataURL('image/jpeg',.86),width:c.width,height:c.height,page:pageNo};
  }catch(e){console.error('No se pudo preparar el plano para el informe',e);return null}
}

function minuteBase64Utf8(str){return btoa(unescape(encodeURIComponent(str)))}
function minuteWrapBase64(b64){let out='';b64=String(b64||'');for(let i=0;i<b64.length;i+=76)out+=b64.slice(i,i+76)+'\r\n';return out}
function minuteDataPart(dataUrl,cid){
  let m=String(dataUrl||'').match(/^data:([^;]+);base64,(.*)$/);if(!m)return '';
  return '--PTMIME\r\n'+
    'Content-Type: '+m[1]+'\r\n'+
    'Content-Transfer-Encoding: base64\r\n'+
    'Content-ID: <'+cid+'>\r\n'+
    'Content-Location: '+cid+'\r\n\r\n'+
    minuteWrapBase64(m[2])+'\r\n';
}
reportMinuteWord=async function(id){
  let m=db.minutes.find(x=>x.id===id);if(!m)return;
  if(!window.docx)return alert('No se ha podido cargar el generador Word. Comprueba la conexión y vuelve a intentarlo.');
  try{
    const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,AlignmentType}=window.docx;
    let incidents=m.snapshot||((m.incidents||[]).map(x=>db.incidents.find(i=>i.id===x)).filter(Boolean)),o=minuteOptions(m),children=[];
    const txt=v=>String(v===undefined||v===null||v===''?'—':v);
    const p=(text,opt={})=>new Paragraph({children:[new TextRun({text:txt(text),bold:!!opt.bold,size:opt.size||20,color:opt.color})],spacing:{after:opt.after??100}});
    const heading=(text,level=HeadingLevel.HEADING_2)=>new Paragraph({text:txt(text),heading:level,spacing:{before:160,after:100}});
    const dataBytes=dataUrl=>{let b64=String(dataUrl||'').split(',')[1]||'',bin=atob(b64),a=new Uint8Array(bin.length);for(let n=0;n<bin.length;n++)a[n]=bin.charCodeAt(n);return a};
    const imageParagraph=(dataUrl,w,h)=>{let maxW=300,maxH=240,r=Math.min(maxW/Math.max(1,w),maxH/Math.max(1,h),1),ww=Math.max(1,Math.round(w*r)),hh=Math.max(1,Math.round(h*r));return new Paragraph({children:[new ImageRun({data:dataBytes(dataUrl),transformation:{width:ww,height:hh}})],spacing:{after:120}})};
    children.push(new Paragraph({children:[new TextRun({text:'PERLENTAUCHER',bold:true,size:36,color:'5D856F'})],spacing:{after:80}}));
    children.push(new Paragraph({children:[new TextRun({text:`ACTA DE OBRA ${m.no}`,bold:true,size:22,color:'5D856F'})],spacing:{after:140}}));
    children.push(new Paragraph({children:[new TextRun({text:txt(m.work),bold:true,size:28})],spacing:{after:80}}));
    children.push(new Paragraph({children:[new TextRun({text:txt(m.title),bold:true,size:24})],spacing:{after:80}}));
    children.push(p(`${m.date} · ${m.author} · ${incidents.length} incidencia(s)`,{size:18,after:140}));
    if(m.notes)children.push(p(m.notes,{size:20,after:160}));
    for(let i of incidents){
      let head=[];if(o.number)head.push(i.no);if(o.title)head.push(i.title);children.push(heading(head.join(' · ')||'Incidencia'));
      if(o.status)children.push(p(`Estado: ${txt(i.status)}`));
      if(o.categories)children.push(p(`Categorías: ${txt(catsOf(i).join(', '))}`));
      if(o.responsibles)children.push(p(`Responsables: ${txt(respsOf(i).join(', '))}`));
      if(o.priority)children.push(p(`Prioridad: ${txt(i.priority)}`));
      if(o.zone)children.push(p(`Zona: ${txt(i.zone)}`));
      if(o.location)children.push(p(`Ubicación: ${txt(i.location)}`));
      if(o.dueDate)children.push(p(`Fecha límite: ${txt(i.dueDate)}`));
      if(o.description){children.push(heading('Descripción',HeadingLevel.HEADING_3));children.push(p(i.description||'—'));}
      if(o.photos){
        let pics=minutePhotoFiles(i);if(pics.length){children.push(heading('Fotografías',HeadingLevel.HEADING_3));for(let f of pics){let x=await minuteLoadImage(f.url);if(x)children.push(imageParagraph(x.data,x.img.width,x.img.height));}}
      }
      if(o.plan&&i.planCapture){let shot=await renderPlanCapture(i.planCapture);if(shot){children.push(heading('Localización en plano',HeadingLevel.HEADING_3));children.push(imageParagraph(shot.data,shot.width,shot.height));}}
      if(o.followup&&(i.history||[]).length){children.push(heading('Seguimientos',HeadingLevel.HEADING_3));for(let h of i.history){children.push(p(`${h.date||''} · ${h.author||''}${h.status?' · '+h.status:''}`,{bold:true,size:18,after:40}));children.push(p(h.text||'',{size:18,after:100}));}}
    }
    let doc=new Document({sections:[{properties:{page:{margin:{top:720,right:720,bottom:720,left:720}}},children}]});
    let blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${m.work} - ${m.title} - ${m.no}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(e){console.error('Error generando Word del acta',e);alert('No se pudo generar el Word. Vuelve a intentarlo y, si continúa, avísame.');}
}
